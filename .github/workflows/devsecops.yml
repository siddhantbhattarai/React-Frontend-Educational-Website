name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarqube-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sonarqube-scans
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test SonarQube Connection
        run: curl -I "${{ secrets.SONAR_HOST_URL }}/api/system/status"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./
          args: >
            -Dsonar.projectKey=devsecops_edu_platform
            -Dsonar.projectName="DevSecOps Educational Website"
            -Dsonar.projectVersion=1.0.3
            -Dsonar.sources=.
            -Dsonar.java.binaries=target
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/test/**

  trivy-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trivy-scans
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean workspace
        run: |
          rm -f trivy_envs.txt || true
          rm -rf .trivy* || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t educational-website .

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'educational-website'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          cache-dir: /tmp/trivy-cache
          skip-files: trivy_envs.txt

      - name: Post-cleanup
        run: |
          docker rmi educational-website || true
          rm -f trivy_envs.txt || true
